<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打字測驗系統 - 雲端名單版</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #ecf0f1; margin-bottom: 30px; }

        #setup-screen { background-color: #34495e; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); position: relative; }
        .input-group { margin-bottom: 20px; font-size: 20px; }
        .input-group input { font-size: 24px; padding: 10px; border-radius: 8px; border: none; width: 200px; text-align: center; font-weight: bold; }
        
        #student-name-display { font-size: 24px; font-weight: bold; color: #f1c40f; display: block; margin-top: 15px; }
        
        .time-options { margin-top: 30px; }
        .time-btn { font-size: 18px; padding: 15px 25px; margin: 10px; cursor: pointer; border: none; border-radius: 10px; background-color: #3498db; color: white; transition: 0.3s; }
        .time-btn:hover { background-color: #2980b9; transform: scale(1.05); }
        .time-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; transform: none; }

        /* 載入名單時的遮罩層 */
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.9); border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; z-index: 10; color: #f1c40f; }

        #game-screen { display: none; }
        .info-bar { display: flex; justify-content: space-around; background-color: #34495e; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 20px; }
        .highlight-val { color: #f1c40f; font-weight: bold; font-size: 24px; }
        
        #letter-display { font-size: 36px; font-family: 'Courier New', Courier, monospace; background-color: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.2); text-align: left; line-height: 1.6; margin-bottom: 30px; word-wrap: break-word; }
        .char-typed { color: #bdc3c7; }
        .char-current { color: #e74c3c; background-color: #f1c40f; border-radius: 4px; padding: 0 2px; }
        .char-upcoming { color: #2c3e50; }

        #typing-input { font-size: 36px; padding: 10px; width: 150px; text-align: center; border-radius: 10px; border: 4px solid #bdc3c7; outline: none; }
        
        #result-screen { display: none; background-color: #27ae60; padding: 40px; border-radius: 20px; }
        .restart-btn { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; border-radius: 5px; border: none; }
        #upload-status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #f1c40f; }
    </style>
</head>
<body>

<div class="container">
    <h1>⌨️ 英文字母打字測驗系統</h1>

    <div id="setup-screen">
        <!-- 載入名單用的遮罩 -->
        <div id="loading-overlay">⏳ 正在與 Google 雲端連線下載最新名單...</div>

        <div class="input-group">
            班級座號：<br><br>
            <input type="number" id="student-id" placeholder="例如：30101" autocomplete="off" disabled>
        </div>
        <div class="input-group">
            <span id="student-name-display">請先輸入班級座號</span>
        </div>
        
        <p style="margin-top: 30px;">請選擇測驗時間：</p>
        <div class="time-options">
            <button class="time-btn" onclick="startGame(1)" disabled>1 分鐘</button>
            <button class="time-btn" onclick="startGame(2)" disabled>2 分鐘</button>
            <button class="time-btn" onclick="startGame(5)" disabled>5 分鐘</button>
            <button class="time-btn" onclick="startGame(10)" disabled>10 分鐘</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="info-bar">
            <div>測驗者: <span id="display-player" class="highlight-val"></span></div>
            <div>剩餘時間: <span id="timer" class="highlight-val">--:--</span></div>
            <div>得分: <span id="score" class="highlight-val">0</span></div>
            <div>答對數: <span id="correct-count" class="highlight-val">0</span></div>
        </div>
        <div id="letter-display"></div>
        <input type="text" id="typing-input" autocomplete="off" placeholder="在此輸入">
        <p id="msg" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <div id="result-screen">
        <h2>🎉 測驗結束！</h2>
        <div id="final-stats" style="font-size: 24px; line-height: 2;"></div>
        <div id="upload-status">⏳ 成績上傳中，請稍候...</div>
        <button class="restart-btn" id="restart-btn" onclick="location.reload()" style="display: none;">回到首頁</button>
    </div>
</div>

<script>
    // ★★★ 請把下面這行換成你的 Google Apps Script 網址 ★★★
    const SCRIPT_URL = "在此貼上你的 Google Apps Script 網址"; 

    // 用來儲存從雲端抓下來的名單
    let cloudStudentList = {};
    let confirmedName = ""; 

    const studentInput = document.getElementById('student-id');
    const nameDisplay = document.getElementById('student-name-display');
    const timeBtns = document.querySelectorAll('.time-btn');
    const loadingOverlay = document.getElementById('loading-overlay');

    // 網頁一載入，馬上跟 Google 要名單
    window.onload = function() {
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                cloudStudentList = data; // 把抓下來的資料存起來
                loadingOverlay.style.display = 'none'; // 隱藏載入畫面
                studentInput.disabled = false; // 開放輸入框
                studentInput.focus();
            })
            .catch(error => {
                loadingOverlay.textContent = "❌ 名單下載失敗，請檢查網址或網路。";
                loadingOverlay.style.color = "#e74c3c";
            });
    };

    // 監聽學生輸入，核對雲端名單
    studentInput.addEventListener('input', function() {
        const idVal = this.value.trim();

        if (idVal.length > 0) {
            if (cloudStudentList[idVal]) {
                confirmedName = cloudStudentList[idVal];
                nameDisplay.textContent = `👋 你好，${confirmedName} 同學！`;
                nameDisplay.style.color = "#2ecc71";
                timeBtns.forEach(btn => btn.disabled = false); // 開放測驗按鈕
            } else {
                confirmedName = "";
                nameDisplay.textContent = "❌ 查無此人，請檢查班級座號";
                nameDisplay.style.color = "#e74c3c";
                timeBtns.forEach(btn => btn.disabled = true);
            }
        } else {
            confirmedName = "";
            nameDisplay.textContent = "請先輸入班級座號";
            nameDisplay.style.color = "#f1c40f";
            timeBtns.forEach(btn => btn.disabled = true);
        }
    });

    // --- 遊戲邏輯 ---
    const sequence = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    let currentIndex = 0; let score = 0; let correctCount = 0; let timeLeft = 0; let timerInterval;

    const setupScreen = document.getElementById('setup-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');
    const letterDisplay = document.getElementById('letter-display');
    const typingInput = document.getElementById('typing-input');

    function startGame(minutes) {
        if (!confirmedName) return; 

        document.getElementById('display-player').textContent = confirmedName;
        currentIndex = 0; score = 0; correctCount = 0; timeLeft = minutes * 60;
        setupScreen.style.display = 'none'; gameScreen.style.display = 'block';
        
        initLetterDisplay(); updateTimerDisplay(); typingInput.focus();

        timerInterval = setInterval(() => {
            timeLeft--; updateTimerDisplay();
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function initLetterDisplay() {
        letterDisplay.innerHTML = "";
        for (let i = 0; i < sequence.length; i++) {
            const span = document.createElement("span");
            span.id = "char-" + i; span.textContent = sequence[i];
            span.className = (i === 0) ? "char-current" : "char-upcoming";
            letterDisplay.appendChild(span);
        }
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60); const s = timeLeft % 60;
        document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' + s : s}`;
    }

    typingInput.addEventListener('input', function() {
        const typedChar = this.value; this.value = "";
        if (typedChar === "" || currentIndex >= sequence.length) return;

        if (typedChar === sequence[currentIndex]) {
            score += 10; correctCount += 1;
            document.getElementById("char-" + currentIndex).className = "char-typed";
            currentIndex++;

            if (currentIndex < sequence.length) {
                document.getElementById("char-" + currentIndex).className = "char-current";
            } else {
                endGame();
            }

            document.getElementById('score').textContent = score;
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('msg').textContent = "✅ 正確";
            document.getElementById('msg').style.color = "#2ecc71";
        } else {
            document.getElementById('msg').textContent = `❌ 錯誤！目標是：${sequence[currentIndex]}`;
            document.getElementById('msg').style.color = "#e74c3c";
        }
    });

    function endGame() {
        clearInterval(timerInterval);
        gameScreen.style.display = 'none'; resultScreen.style.display = 'block';

        const idVal = studentInput.value;

        document.getElementById('final-stats').innerHTML = `
            姓名：${confirmedName} (${idVal})<br><hr>
            最終得分：<span style="color:#f1c40f">${score}</span><br>
            答對總數：${correctCount} / ${sequence.length}
        `;

        // 上傳到雲端
        const data = {
            studentId: idVal,      // 傳送班級座號
            name: confirmedName,   // 傳送姓名
            score: score,
            correctCount: correctCount
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
            body: JSON.stringify(data)
        })
        .then(response => {
            document.getElementById('upload-status').textContent = "✅ 成績已成功上傳至雲端！";
            document.getElementById('upload-status').style.color = "white";
            document.getElementById('restart-btn').style.display = "inline-block";
        })
        .catch(error => {
            document.getElementById('upload-status').textContent = "❌ 上傳失敗，請檢查網路連線。";
            document.getElementById('upload-status').style.color = "#e74c3c";
            document.getElementById('restart-btn').style.display = "inline-block";
        });
    }
</script>

</body>
</html>
