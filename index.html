<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業雙語打字測驗系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f0f0f0; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        #setup-screen { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; text-align: center; }
        .input-group { margin-bottom: 20px; font-size: 20px; }
        .input-group input, .input-group select { font-size: 20px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 220px; text-align: center; margin: 5px; }
        #student-name-display { font-size: 24px; font-weight: bold; color: #f39c12; display: block; margin-top: 15px; }
        
        .time-options { margin-top: 30px; }
        .btn { font-size: 18px; padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; background-color: #3498db; color: white; transition: 0.2s; }
        .btn:hover { background-color: #2980b9; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; z-index: 10; color: #e67e22; border-radius: 10px; }

        #game-screen { display: none; background-color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .top-bar { display: flex; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2px solid #ccc; background: #eee; }
        .stat-box { flex: 1; display: flex; align-items: center; border-right: 1px solid #fff; }
        .stat-label { color: white; padding: 15px 10px; font-size: 16px; white-space: nowrap; }
        .stat-val { flex: 1; font-size: 36px; padding: 5px 10px; background-color: #f9f9f9; }
        
        .bg-time { background-color: #2980b9; }
        .color-time { color: #e67e22; }
        .bg-correct { background-color: #27ae60; }
        .color-correct { color: #27ae60; }
        .bg-wrong { background-color: #c0392b; }
        .color-wrong { color: #c0392b; }
        .bg-untyped { background-color: #d35400; }
        .color-untyped { color: #d35400; }
        .bg-speed { background-color: #8e44ad; }
        .color-speed { color: #8e44ad; }
        
        .btn-finish { background-color: #7fb3d5; border: none; padding: 0 30px; font-size: 18px; color: white; cursor: pointer; height: 100%; width: 100%; font-weight: bold; }
        .btn-finish:hover { background-color: #5dade2; }

        .typing-area { background-color: #ffffcc; padding: 30px; font-family: 'Courier New', Courier, "Microsoft JhengHei", monospace; font-size: 28px; min-height: 400px; overflow-x: auto; }
        
        .prep-box { border: 2px dashed #999; padding: 10px; text-align: center; color: #555; background: #fff; margin-bottom: 30px; font-size: 24px; cursor: pointer; font-weight: bold; }
        .prep-box:hover { background: #f0f0f0; }

        .line-container { margin-bottom: 20px; min-width: 800px; }
        
        .target-text { color: #333; padding-left: 5px; white-space: pre; letter-spacing: 4px; font-weight: bold; }
        
        .input-text { 
            width: 100%; 
            font-family: 'Courier New', Courier, "Microsoft JhengHei", monospace; 
            font-size: 28px; 
            background: transparent; 
            border: none; 
            border-bottom: 2px dashed #777; 
            outline: none; 
            color: #2980b9;
            padding: 5px;
            box-sizing: border-box;
            letter-spacing: 4px; 
            font-weight: bold;
        }
        .input-text:focus { border-bottom: 2px solid #e74c3c; background-color: rgba(255,255,255,0.5); }
        
        .end-mark-btn { 
            border: 2px dashed #999; 
            display: inline-block; 
            padding: 10px 30px; 
            margin-top: 20px; 
            color: #555; 
            background-color: white;
            font-size: 24px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .end-mark-btn:hover { background-color: #e74c3c; color: white; border-color: #e74c3c; }

        #result-screen { display: none; background-color: #27ae60; padding: 40px; border-radius: 10px; text-align: center; color: white; margin-top: 20px; }
        #upload-status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #f1c40f; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen">
        <div id="loading-overlay">⏳ 正在與 Google 雲端連線下載名單...</div>
        <h2>📝 專業雙語打字測驗系統</h2>
        
        <div class="input-group">
            <input type="number" id="student-id" placeholder="班級座號 (如: 30101)" autocomplete="off" disabled>
            <span id="student-name-display">請先輸入班級座號</span>
        </div>

        <div class="input-group" style="margin-top: 30px; background: #f9f9f9; padding: 20px; border-radius: 10px;">
            <label style="font-weight: bold; margin-right: 10px;">測驗模式：</label>
            <select id="mode-select" disabled>
                <optgroup label="英文測驗">
                    <option value="UPPER">大寫 A~Z</option>
                    <option value="LOWER">小寫 a~z</option>
                    <option value="RAND_UPPER">隨機大寫 A~Z</option>
                    <option value="RAND_LOWER">隨機小寫 a~z</option>
                    <option value="ARTICLE">亂數文章 (英文)</option>
                </optgroup>
                <optgroup label="中文測驗">
                    <option value="ZH_VOCAB">隨機詞彙 (中文題庫)</option>
                    <option value="ZH_ARTICLE" selected>亂數文章 (中文題庫)</option>
                </optgroup>
            </select>
            
            <br><br>
            <label style="font-weight: bold; margin-right: 10px;">測驗時間：</label>
            <select id="time-select" disabled>
                <option value="1">1 分鐘</option>
                <option value="2">2 分鐘</option>
                <option value="5">5 分鐘</option>
                <option value="10">10 分鐘</option>
            </select>
        </div>

        <button class="btn" id="start-btn" onclick="initGame()" disabled style="font-size: 24px; padding: 15px 40px; background-color: #27ae60;">開始測驗</button>
    </div>

    <div id="game-screen">
        <div class="top-bar">
            <div class="stat-box"><div class="stat-label bg-time">時間</div><div class="stat-val color-time" id="timer">--:--</div></div>
            <div class="stat-box"><div class="stat-label bg-correct">正確</div><div class="stat-val color-correct" id="val-correct">0</div></div>
            <div class="stat-box"><div class="stat-label bg-wrong">錯誤</div><div class="stat-val color-wrong" id="val-wrong">0</div></div>
            <div class="stat-box"><div class="stat-label bg-untyped">沒打</div><div class="stat-val color-untyped" id="val-untyped">0</div></div>
            <div class="stat-box"><div class="stat-label bg-speed">速度</div><div class="stat-val color-speed" id="val-speed">0</div></div>
            <div class="stat-box" style="border:none; padding: 0;"><button class="btn-finish" onclick="forceEndGame()">查看成績</button></div>
        </div>

        <div class="typing-area">
            <div class="prep-box" id="prep-box" onclick="startGameTimer()">準備區：點擊此處，或按 Enter 開始計時</div>
            <div id="text-lines-container"></div>
            <button class="end-mark-btn" onclick="forceEndGame()">[ 結 束 ]</button>
        </div>
    </div>

    <div id="result-screen">
        <h2>🎉 測驗結束！</h2>
        <div id="final-stats" style="font-size: 24px; line-height: 2;"></div>
        <div id="upload-status">⏳ 成績上傳中，請稍候...</div>
        <button class="btn" id="restart-btn" onclick="location.reload()" style="display: none; background-color: #fff; color: #27ae60; margin-top: 20px; font-weight: bold;">回到首頁</button>
    </div>
</div>

<script>
    // ★★★ 務必更換為你的 Google Apps Script 網址 ★★★
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy4ScFfE4H_Ct-vx0wOMkQ34r3L-H18V31bCiLdcgtOVpwNaHPMc56VtxawBw_Xe6K/exec"; 

    let cloudStudentList = {};
    let confirmedName = ""; 
    const studentInput = document.getElementById('student-id');
    const nameDisplay = document.getElementById('student-name-display');
    const startBtn = document.getElementById('start-btn');
    const modeSelect = document.getElementById('mode-select');
    const timeSelect = document.getElementById('time-select');

    window.onload = function() {
        fetch(SCRIPT_URL).then(r => r.json()).then(data => {
            cloudStudentList = data; 
            document.getElementById('loading-overlay').style.display = 'none';
            studentInput.disabled = false; studentInput.focus();
        }).catch(e => {
            document.getElementById('loading-overlay').textContent = "名單下載失敗，將啟用離線模式。";
            setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; studentInput.disabled = false; }, 2000);
        });
    };

    studentInput.addEventListener('input', function() {
        const idVal = this.value.trim();
        if (idVal.length > 0) {
            if(Object.keys(cloudStudentList).length === 0) {
                confirmedName = "測試員"; nameDisplay.textContent = "⚠️ 離線測試模式"; nameDisplay.style.color = "#e67e22"; enableSetup(); return;
            }
            if (cloudStudentList[idVal]) {
                confirmedName = cloudStudentList[idVal];
                nameDisplay.textContent = `👋 你好，${confirmedName} 同學！`; nameDisplay.style.color = "#27ae60"; enableSetup();
            } else { disableSetup(); }
        } else { disableSetup(); }
    });

    function enableSetup() { startBtn.disabled = false; modeSelect.disabled = false; timeSelect.disabled = false; }
    function disableSetup() { startBtn.disabled = true; modeSelect.disabled = true; timeSelect.disabled = true; confirmedName = ""; nameDisplay.textContent = "查無此人，請檢查班級座號"; nameDisplay.style.color = "#c0392b"; }

    const EN_ARTICLES = [
        "The quick brown fox jumps over the lazy dog. This classic sentence contains every letter in the English alphabet.",
        "Computer programming is like solving a giant puzzle. You must carefully put the right logic pieces together to make the software function.",
        "Artificial intelligence is rapidly changing the whole world around us. From self-driving cars to smart voice assistants in our homes.",
        "A fast typing speed takes a lot of time and consistent practice. Try your best not to look at the keyboard while you are typing.",
        "Walking through the quiet forest is a relaxing experience. The warm sunlight shines gently through the green canopy."
    ];

    // ★ 擴充版：中文優美文章題庫 (10篇)
    const ZH_ARTICLES = [
        "早晨的陽光穿透樹葉，灑在森林小學的教室裡。微風輕輕吹過，伴隨著蟲鳴鳥叫，讓學生們能在充滿大自然氣息的環境中，靜下心來展開一天的學習旅程。",
        "學習程式設計就像是在施展魔法。透過迴圈與變數的組合，我們能讓電腦聽從指令，甚至創造出有趣的小遊戲。只要具備清晰的邏輯，每個人都能成為優秀的創作者。",
        "古希臘哲學家蘇格拉底曾說過，我唯一知道的事，就是我什麼都不知道。保持一顆好奇與謙卑的心去探索世界，不斷提出問題，才是獲取真實知識與智慧的最佳途徑。",
        "在人工智慧快速發展的時代，科技正在改變我們的生活方式。從自動駕駛到智慧教學平台，未來的世界充滿無限可能。我們應該擁抱新技術，並學習如何善用它們。",
        "閱讀是一扇通往世界的窗戶。透過書本，我們可以跨越時空的限制，與古今中外的智者進行對話。在字裡行間尋找智慧的結晶，豐富我們的心靈與視野。",
        "每個人都會有害怕的事情，比如黑暗或是高處。克服恐懼的第一步是了解它，想想為什麼會害怕。接著可以試著慢慢接觸這些事情，勇敢面對恐懼會讓你變得更加自信。",
        "哪怕前方的道路佈滿荊棘，只要心中有光，就能照亮未來的方向。每一次的失敗，都是通往成功的一塊墊腳石。勇敢面對挑戰，你將會發現一個更強大的自己。",
        "搭上神隱少女的神秘列車，或是跟著龍貓在夜晚的森林裡翱翔。豐富的想像力是創新的泉源，它能帶領我們跨越現實的框架，看見更多不一樣的奇妙世界。",
        "團隊合作是達成偉大目標的關鍵。每個人都有自己獨特的優點與專長，像拼圖一樣互補不足。學會傾聽他人的意見，包容不同的想法，才能發揮出一加一大於二的力量。",
        "時間就像一條奔流不息的河，過去了就不會再回來。學會做好時間管理，把每天的任務安排得井然有序。珍惜每一分每一秒，不要讓寶貴的青春在猶豫中白白流逝。"
    ];

    // ★ 新增：中文隨機詞彙庫 (雙字詞與四字成語混合)
    const ZH_WORDS = [
        "學習", "成長", "努力", "堅持", "未來", "夢想", "希望", "挑戰", "成功", "自信",
        "科技", "創新", "程式", "設計", "網路", "雲端", "資料", "邏輯", "系統", "資訊",
        "自然", "森林", "海洋", "陽光", "微風", "宇宙", "星空", "山川", "河流", "生態",
        "行雲流水", "腳踏實地", "百折不撓", "聚沙成塔", "持之以恆", "溫故知新", "精益求精", "學無止境"
    ];

    let targetLines = []; 
    let totalCharsCount = 0; 
    
    function wrapEnText(text, maxLength) {
        const words = text.split(' ');
        let lines = []; let currentLine = "";
        words.forEach(word => {
            if ((currentLine + word).length > maxLength) {
                lines.push(currentLine.trim()); currentLine = word + " ";
            } else { currentLine += word + " "; }
        });
        if (currentLine.trim().length > 0) lines.push(currentLine.trim());
        return lines;
    }

    function wrapZhText(text, maxLength) {
        let lines = [];
        for (let i = 0; i < text.length; i += maxLength) {
            lines.push(text.substring(i, i + maxLength));
        }
        return lines;
    }

    // ★ 新增：隨機生成順暢的中文詞彙短句
    function generateVocabText() {
        let text = "";
        // 生成大約 60 個字的長度，以符合一般測驗需求
        for (let i = 0; i < 15; i++) {
            let word1 = ZH_WORDS[Math.floor(Math.random() * ZH_WORDS.length)];
            let word2 = ZH_WORDS[Math.floor(Math.random() * ZH_WORDS.length)];
            // 讓詞彙組合起來像是一句通順的話
            text += `${word1}，${word2}。`; 
        }
        return text;
    }

    function generateTargetText() {
        const mode = modeSelect.value;
        const shuffle = str => str.split('').sort(() => 0.5 - Math.random()).join('');

        switch(mode) {
            case "UPPER": targetLines = ["ABCDEFGHIJKLMNOPQRSTUVWXYZ"]; break;
            case "LOWER": targetLines = ["abcdefghijklmnopqrstuvwxyz"]; break;
            case "RAND_UPPER": targetLines = [shuffle("ABCDEFGHIJKLMNOPQRSTUVWXYZ")]; break;
            case "RAND_LOWER": targetLines = [shuffle("abcdefghijklmnopqrstuvwxyz")]; break;
            case "ARTICLE": 
                targetLines = wrapEnText(EN_ARTICLES[Math.floor(Math.random() * EN_ARTICLES.length)], 50); 
                break;
            case "ZH_VOCAB": 
                // 產生隨機詞彙，每行 25 字
                targetLines = wrapZhText(generateVocabText(), 25); 
                break;
            case "ZH_ARTICLE": 
                targetLines = wrapZhText(ZH_ARTICLES[Math.floor(Math.random() * ZH_ARTICLES.length)], 25); 
                break;
        }
        totalCharsCount = targetLines.reduce((sum, line) => sum + line.length, 0);
    }

    let timeLeft = 0; let totalTime = 0; let timerInterval = null; let isGameRunning = false;
    let stats = { correct: 0, wrong: 0, untyped: 0, speed: 0 };

    function initGame() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        generateTargetText();
        totalTime = parseInt(timeSelect.value) * 60;
        timeLeft = totalTime;
        stats.untyped = totalCharsCount; 
        
        updateTopBar();
        renderTypingArea();
    }

    function renderTypingArea() {
        const container = document.getElementById('text-lines-container');
        container.innerHTML = "";
        
        targetLines.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'line-container';
            div.innerHTML = `
                <div class="target-text" id="target-${index}">${line}</div>
                <input type="text" class="input-text" id="input-${index}" autocomplete="off" disabled spellcheck="false" maxlength="${line.length + 5}">
            `;
            container.appendChild(div);

            const inputField = div.querySelector('input');
            let isComposing = false; 

            inputField.addEventListener('compositionstart', () => { isComposing = true; });
            inputField.addEventListener('compositionend', () => { 
                isComposing = false; 
                calculateScore(); 
            });

            inputField.addEventListener('input', () => {
                if (!isComposing) calculateScore(); 
            });
            
            inputField.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (isComposing) return; // 防止注音選字時跳行
                    
                    e.preventDefault();
                    const nextInput = document.getElementById(`input-${index + 1}`);
                    if (nextInput) nextInput.focus();
                    else forceEndGame();
                }
            });
        });
    }

    document.addEventListener('keydown', function(e) {
        if (!isGameRunning && e.key === 'Enter' && document.getElementById('game-screen').style.display === 'block') {
            startGameTimer();
        }
    });

    function startGameTimer() {
        if (isGameRunning) return;
        isGameRunning = true;
        document.getElementById('prep-box').style.background = '#e74c3c';
        document.getElementById('prep-box').style.color = 'white';
        document.getElementById('prep-box').textContent = "計時中...";

        const inputs = document.querySelectorAll('.input-text');
        inputs.forEach(input => input.disabled = false);
        if(inputs.length > 0) inputs[0].focus();

        timerInterval = setInterval(() => {
            timeLeft--; updateTopBar();
            if (timeLeft <= 0) forceEndGame();
        }, 1000);
    }

    function calculateScore() {
        if (!isGameRunning) return;
        
        let currentCorrect = 0;
        let currentWrong = 0;
        let allFinished = true;

        targetLines.forEach((targetStr, index) => {
            const inputStr = document.getElementById(`input-${index}`).value;
            const targetDiv = document.getElementById(`target-${index}`);
            let formattedTarget = ""; 
            let lineCorrect = 0;
            let lineWrong = 0;

            if (inputStr.length < targetStr.length) allFinished = false; 

            const maxLength = Math.max(targetStr.length, inputStr.length);
            
            for (let i = 0; i < maxLength; i++) {
                if (i < targetStr.length && i < inputStr.length) {
                    if (inputStr[i] === targetStr[i]) {
                        formattedTarget += `<span style="color: #bdc3c7;">${targetStr[i]}</span>`;
                        lineCorrect++;
                    } else {
                        formattedTarget += `<span style="color: #c0392b; background-color: #fadbd8; border-radius: 3px;">${targetStr[i]}</span>`;
                        lineWrong++;
                    }
                } else if (i < targetStr.length) {
                    formattedTarget += targetStr[i]; 
                } else {
                    let extraChar = inputStr[i] === ' ' ? '_' : inputStr[i];
                    formattedTarget += `<span style="color: #c0392b; text-decoration: underline;">${extraChar}</span>`;
                    lineWrong++;
                }
            }

            targetDiv.innerHTML = formattedTarget;
            currentCorrect += lineCorrect;
            currentWrong += lineWrong;
        });

        stats.correct = currentCorrect;
        stats.wrong = currentWrong;
        stats.untyped = Math.max(0, totalCharsCount - currentCorrect - currentWrong);
        
        updateTopBar();

        if (allFinished && stats.correct === totalCharsCount) {
            setTimeout(forceEndGame, 200); 
        }
    }

    function updateTopBar() {
        const m = Math.floor(Math.max(0, timeLeft) / 60); 
        const s = Math.max(0, timeLeft) % 60;
        const elapsedMinutes = (totalTime - timeLeft) / 60;
        stats.speed = elapsedMinutes > 0 ? Math.round(stats.correct / elapsedMinutes) : 0;

        document.getElementById('timer').textContent = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        document.getElementById('val-correct').textContent = stats.correct;
        document.getElementById('val-wrong').textContent = stats.wrong;
        document.getElementById('val-untyped').textContent = stats.untyped;
        document.getElementById('val-speed').textContent = stats.speed;
    }

    function forceEndGame() {
        if (!isGameRunning && timeLeft === totalTime) return; 
        if (!isGameRunning && timeLeft > 0) return; 

        clearInterval(timerInterval); isGameRunning = false;
        document.querySelectorAll('.input-text').forEach(input => input.disabled = true);
        
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        const idVal = studentInput.value;
        const modeName = modeSelect.options[modeSelect.selectedIndex].text;
        
        const finalScore = Math.max(0, Math.round(((stats.correct - stats.wrong) / totalCharsCount) * 100)); 

        document.getElementById('final-stats').innerHTML = `
            姓名：${confirmedName} (${idVal})<br>
            測驗模式：${modeName}<br><hr>
            打字速度：${stats.speed} 字/分<br>
            正確：${stats.correct} / 錯誤：${stats.wrong} / 未打：${stats.untyped}<br>
            <h3 style="color:#f1c40f; font-size: 36px;">總成績：${finalScore} 分</h3>
        `;

        const data = { studentId: idVal, name: confirmedName, score: finalScore, correctCount: stats.correct };

        if(Object.keys(cloudStudentList).length === 0) {
            document.getElementById('upload-status').textContent = "⚠️ 離線模式，成績未上傳。";
            document.getElementById('restart-btn').style.display = "inline-block"; return;
        }

        fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) })
        .then(() => {
            document.getElementById('upload-status').textContent = "✅ 成績已成功上傳至雲端！";
            document.getElementById('restart-btn').style.display = "inline-block";
        }).catch(() => {
            document.getElementById('upload-status').textContent = "❌ 上傳失敗，請檢查網路連線。";
            document.getElementById('restart-btn').style.display = "inline-block";
        });
    }
</script>

</body>
</html>
